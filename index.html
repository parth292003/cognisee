<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, minimal-ui, viewport-fit=cover" />
    <title>Cognisee — Artificial Collective Intelligence</title>
    <meta name="description" content="AI should make people and institutions more capable, not less. Cognisee builds cognitive infrastructure for Artificial Collective Intelligence." />
    
    <link rel="icon" type="image/png" href="/assets/logos/cognisee-symbol-white-transparent-1600.png" />
    <script>
      if (window.location.pathname !== '/' && !window.location.pathname.startsWith('/api')) {
        window.history.replaceState(null, '', '/' + window.location.search + window.location.hash);
      }
    </script>
    
    <!-- Open Graph -->
    <meta property="og:title" content="Cognisee — Artificial Collective Intelligence" />
    <meta property="og:site_name" content="Cognisee" />
    <meta property="og:url" content="https://www.cognisee.ai" />
    <meta property="og:description" content="AI should make people and institutions more capable, not less. Cognisee builds cognitive infrastructure for Artificial Collective Intelligence." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <style>
      @font-face {
        font-family: IBMPlexMono-Medium;
        src: url(https://www.igloo.inc/assets/IBMPlexMono-Medium-897c8c30.woff2) format("woff2"),
             url(https://www.igloo.inc/assets/IBMPlexMono-Medium-1e253194.woff) format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: IBMPlexMono-Regular;
        src: url(https://www.igloo.inc/assets/IBMPlexMono-Regular-d3034935.woff2) format("woff2"),
             url(https://www.igloo.inc/assets/IBMPlexMono-Regular-419d45f6.woff) format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html {
        --default-font: sans-serif;
        --bgColor: #A0A5B1;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, html body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bgColor);
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html body .click {
        cursor: pointer;
      }
      html body #app {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body .tp-dfwv {
        max-height: calc(100vh - 16px);
      }
      body .tp-dfwv::-webkit-scrollbar {
        width: 5px;
      }
      body .tp-dfwv::-webkit-scrollbar-track {
        background-color: #4c4f53;
      }
      body .tp-dfwv::-webkit-scrollbar-thumb {
        background-color: #777c81;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
